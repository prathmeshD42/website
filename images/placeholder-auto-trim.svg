<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#cbd5e1" stroke-width="0.8" stroke-opacity="0.6"/>
    </pattern>
  </defs>
  
  <!-- Background with subtle technical grid -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>
  <rect width="600" height="600" fill="url(#grid)"/>
  
  <!-- Outer dashed border -->
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="10 8" stroke-opacity="0.8"/>
  
  <!-- Center Card Area -->
  <rect x="70" y="110" width="460" height="380" rx="16" fill="#ffffff" fill-opacity="0.92" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Camera / Upload Icon -->
  <g transform="translate(255, 145)">
    <circle cx="45" cy="45" r="42" fill="#f59e0b" fill-opacity="0.12"/>
    <path d="M 28 35 L 34 26 L 56 26 L 62 35 L 70 35 C 73 35 75 37 75 40 L 75 62 C 75 65 73 67 70 67 L 20 67 C 17 67 15 65 15 62 L 15 40 C 15 37 17 35 20 35 Z" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="45" cy="51" r="13" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <circle cx="62" cy="41" r="2.5" fill="#f59e0b"/>
  </g>
  
  <!-- Plus Badge -->
  <circle cx="345" cy="180" r="14" fill="#f59e0b"/>
  <path d="M 345 173 L 345 187 M 338 180 L 352 180" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Typography -->
  <text x="300" y="280" font-family="'Poppins', sans-serif, system-ui" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">Automotive Interior Trim Slot</text>
  <text x="300" y="315" font-family="'Poppins', sans-serif, system-ui" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle">Bezel, Clip, Bracket or Handle</text>
  
  <!-- Divider -->
  <line x1="180" y1="345" x2="420" y2="345" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Instructions -->
  <rect x="110" y="365" width="380" height="42" rx="8" fill="#f1f5f9"/>
  <text x="300" y="392" font-family="'Poppins', sans-serif, monospace" font-size="12.5" font-weight="600" fill="#f59e0b" text-anchor="middle">Replace with your component image (600 x 600 px)</text>
  
  <text x="300" y="445" font-family="'Poppins', sans-serif, system-ui" font-size="12" fill="#94a3b8" text-anchor="middle">Click or replace file path in HTML to display your photo</text>
  
  <!-- Corner Tech Markers -->
  <path d="M 36 50 L 36 36 L 50 36" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
  <path d="M 564 50 L 564 36 L 550 36" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
  <path d="M 36 550 L 36 564 L 50 564" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
  <path d="M 564 550 L 564 564 L 550 564" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
</svg>